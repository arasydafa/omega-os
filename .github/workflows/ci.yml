name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/demo/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build + verify dist
        run: |
          npm run build
          npm run verify

      - name: Install (demo)
        working-directory: apps/demo
        run: npm ci

      - name: Build demo
        working-directory: apps/demo
        run: npm run build
