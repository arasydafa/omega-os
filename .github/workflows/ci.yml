name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npm pack --dry-run

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/demo/package-lock.json
      # The demo compiles the linked UI package source, whose peer imports
      # (react, lucide-react) resolve upward — root node_modules must exist.
      - run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm ci --no-audit --no-fund
      - run: npm run build
